name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: RPoRea
    steps:
      - uses: actions/checkout@v4
        with:
          path: RPoRea
      - uses: actions/checkout@v4
        with: { repository: aon-co-jp/Reaxt, path: Reaxt }
      - uses: actions/checkout@v4
        with: { repository: aon-co-jp/RPoem, path: RPoem }
      - uses: actions/checkout@v4
        with: { repository: aon-co-jp/RS-JSON, path: RS-JSON }
      - uses: actions/checkout@v4
        with: { repository: aon-co-jp/open-web-server, path: open-web-server }
      - uses: actions/checkout@v4
        with: { repository: aon-co-jp/RS-SmartTCP, path: RS-SmartTCP }
      - uses: actions/checkout@v4
        with: { repository: aon-co-jp/open-raid-z, path: open-raid-z }
      - uses: actions/checkout@v4
        with: { repository: aon-co-jp/open-cpu, path: open-cpu }
      - uses: actions/checkout@v4
        with: { repository: aon-co-jp/open-cuda, path: open-cuda }
      - uses: actions/checkout@v4
        with: { repository: aon-co-jp/open-directx, path: open-directx }
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p rporea-ffi --release
      - run: cargo test -p rporea -p rporea-ffi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python binding test (real C ABI call)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) export RPOREA_LIB="$PWD/target/release/librporea_ffi.so" ;;
            macOS) export RPOREA_LIB="$PWD/target/release/librporea_ffi.dylib" ;;
            Windows) export RPOREA_LIB="$PWD/target/release/rporea_ffi.dll" ;;
          esac
          python bindings/python/test_rporea.py
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: RPoRea
    steps:
      - uses: actions/checkout@v4
        with:
          path: RPoRea
      - uses: actions/checkout@v4
        with: { repository: aon-co-jp/Reaxt, path: Reaxt }
      - uses: actions/checkout@v4
        with: { repository: aon-co-jp/RPoem, path: RPoem }
      - uses: actions/checkout@v4
        with: { repository: aon-co-jp/RS-JSON, path: RS-JSON }
      - uses: actions/checkout@v4
        with: { repository: aon-co-jp/open-web-server, path: open-web-server }
      - uses: actions/checkout@v4
        with: { repository: aon-co-jp/RS-SmartTCP, path: RS-SmartTCP }
      - uses: actions/checkout@v4
        with: { repository: aon-co-jp/open-raid-z, path: open-raid-z }
      - uses: actions/checkout@v4
        with: { repository: aon-co-jp/open-cpu, path: open-cpu }
      - uses: actions/checkout@v4
        with: { repository: aon-co-jp/open-cuda, path: open-cuda }
      - uses: actions/checkout@v4
        with: { repository: aon-co-jp/open-directx, path: open-directx }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - run: cargo build -p rporea-ffi --release --target aarch64-apple-ios
      - run: cargo build -p rporea-ffi --release --target aarch64-apple-ios-sim
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RPoRea
    steps:
      - uses: actions/checkout@v4
        with:
          path: RPoRea
      - uses: actions/checkout@v4
        with: { repository: aon-co-jp/Reaxt, path: Reaxt }
      - uses: actions/checkout@v4
        with: { repository: aon-co-jp/RPoem, path: RPoem }
      - uses: actions/checkout@v4
        with: { repository: aon-co-jp/RS-JSON, path: RS-JSON }
      - uses: actions/checkout@v4
        with: { repository: aon-co-jp/open-web-server, path: open-web-server }
      - uses: actions/checkout@v4
        with: { repository: aon-co-jp/RS-SmartTCP, path: RS-SmartTCP }
      - uses: actions/checkout@v4
        with: { repository: aon-co-jp/open-raid-z, path: open-raid-z }
      - uses: actions/checkout@v4
        with: { repository: aon-co-jp/open-cpu, path: open-cpu }
      - uses: actions/checkout@v4
        with: { repository: aon-co-jp/open-cuda, path: open-cuda }
      - uses: actions/checkout@v4
        with: { repository: aon-co-jp/open-directx, path: open-directx }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Build for Android (NDK)
        run: |
          NDK="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK/aarch64-linux-android24-clang"
          export CC_aarch64_linux_android="$NDK/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$NDK/llvm-ar"
          cargo build -p rporea-ffi --release --target aarch64-linux-android
